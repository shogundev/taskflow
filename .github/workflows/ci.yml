name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Build app image
        run: docker compose build app

      # Run as the runner's uid so the container can write vendor/ into the
      # bind-mounted checkout (the image's default user is uid 1000).
      - name: Install dependencies
        run: >
          docker compose run --rm --no-deps -T
          --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp
          app composer install --no-interaction --no-progress --prefer-dist

      - name: Lint (Pint)
        run: >
          docker compose run --rm --no-deps -T
          --user "$(id -u):$(id -g)"
          app ./vendor/bin/pint --test

      - name: Generate app key
        run: >
          docker compose run --rm --no-deps -T
          --user "$(id -u):$(id -g)"
          app php artisan key:generate

      - name: Run tests
        run: >
          docker compose run --rm --no-deps -T
          --user "$(id -u):$(id -g)"
          app php artisan test

  publish-dev:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/taskflow
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
