name: Promote to prod

# Manual only: pick an image that already ran on staging and release it to prod.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Staging image tag to promote (for example staging-1a2b3c4)"
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: prod
    concurrency: deploy-prod
    permissions:
      contents: read
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/taskflow' }}
      BASE_URL: ${{ vars.BASE_URL || format('http://{0}', secrets.DO_HOST) }}
      SSH_TARGET: ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}
      SOURCE_TAG: ${{ inputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate tag
        run: |
          [[ "$SOURCE_TAG" =~ ^staging-[0-9a-f]{7}$ ]] || { echo "Tag must look like staging-1a2b3c4"; exit 1; }
          echo "PROD_TAG=prod-${SOURCE_TAG#staging-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Re-tags the existing image on Docker Hub; nothing is rebuilt.
      - name: Promote image
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/taskflow
        run: >
          docker buildx imagetools create
          -t "$IMAGE:$PROD_TAG" -t "$IMAGE:prod"
          "$IMAGE:$SOURCE_TAG"

      - name: Configure SSH
        env:
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DO_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload compose file
        run: scp deploy/docker-compose.yml "$SSH_TARGET:$DEPLOY_PATH/docker-compose.yml"

      - name: Deploy
        run: |
          ssh "$SSH_TARGET" bash -s <<ENDSSH
            set -euo pipefail
            cd $DEPLOY_PATH
            sed -i '/^IMAGE_TAG=/d' .env
            echo "IMAGE_TAG=$PROD_TAG" >> .env
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose exec -T app php artisan migrate --force
            docker image prune -f
          ENDSSH

      - name: Smoke test deployed app
        run: scripts/smoke-test.sh "$BASE_URL" "${{ secrets.SMOKE_EMAIL }}" "${{ secrets.SMOKE_PASSWORD }}"
